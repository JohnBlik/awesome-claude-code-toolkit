<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b15" />

    <title>Lukas Voss — Independent Web Designer &amp; Developer</title>
    <meta
      name="description"
      content="Lukas Voss is an independent designer-developer crafting cinematic websites, ecommerce and web apps for studios, founders and growth teams. Booking projects worldwide."
    />
    <meta name="author" content="Lukas Voss" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lukas Voss — Independent Web Designer & Developer" />
    <meta
      property="og:description"
      content="Cinematic websites, ecommerce and web apps. Crafted in Berlin, shipped worldwide."
    />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lukas Voss — Web Designer & Developer" />
    <meta
      name="twitter:description"
      content="Cinematic websites, ecommerce and web apps. Crafted in Berlin, shipped worldwide."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
      onerror="this.onerror=null;this.remove();"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- JSON-LD: Person -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Lukas Voss",
        "jobTitle": "Independent Web Designer & Developer",
        "url": "/",
        "address": { "@type": "PostalAddress", "addressLocality": "Berlin", "addressCountry": "DE" },
        "email": "mailto:hello@lukasvoss.studio"
      }
    </script>
  </head>
  <body class="bg-[#0b0b15] text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
